AWSTemplateFormatVersion: '2010-09-09'
Description: P07 Shopping Agent - DynamoDB tables + Lambda IAM role

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:

  # ── DynamoDB Tables ──────────────────────────────────────────
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub p07-ph1-shopping-agent-${Environment}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub p07-ph1-shopping-agent-${Environment}-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: review_id
          AttributeType: S
      KeySchema:
        - AttributeName: review_id
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub p07-ph1-shopping-agent-${Environment}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH

  # ── Lambda IAM Role ──────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub p07-ph1-shopping-agent-${Environment}-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ProductsTable.Arn
                  - !GetAtt ReviewsTable.Arn
                  - !GetAtt OrdersTable.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:us-east-1::foundation-model/*
                  - arn:aws:bedrock:us-east-1:*:inference-profile/*

Outputs:
  ProductsTableName:
    Value: !Ref ProductsTable
    Export:
      Name: !Sub p07-${Environment}-products-table

  ReviewsTableName:
    Value: !Ref ReviewsTable
    Export:
      Name: !Sub p07-${Environment}-reviews-table

  OrdersTableName:
    Value: !Ref OrdersTable
    Export:
      Name: !Sub p07-${Environment}-orders-table

  LambdaExecutionRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub p07-${Environment}-lambda-role-arn
